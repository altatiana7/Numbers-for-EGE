function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function cancel(){if('speechSynthesis'in window) speechSynthesis.cancel()}
function voices(){return 'speechSynthesis'in window?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)):[]}
function speak(text){cancel();const status=document.getElementById('voiceStatus');if(!('speechSynthesis'in window)){if(status)status.textContent='В этом браузере нет синтеза речи. Откройте файл в Chrome или Edge.';return}const vs=voices(),v=vs.find(x=>x.voiceURI===voiceId)||vs.find(x=>/^en[-_]GB$/i.test(x.lang))||vs[0];if(!v){if(status)status.textContent='Английский голос пока недоступен. Откройте «Звук» и проверьте голоса устройства.';return}const u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.onstart=()=>{if(status)status.textContent='Звучит: '+v.name+' · '+v.lang};u.onend=()=>{if(status)status.textContent='Озвучка завершена'};u.onerror=e=>{if(status&&e.error!=='interrupted'&&e.error!=='canceled')status.textContent='Не удалось воспроизвести. Проверьте звук устройства и выбранный голос.'};speechSynthesis.speak(u)}
function settings(){const vs=voices();document.getElementById('modal').className='overlay';document.getElementById('modal').innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="Настройка звука"><div class="toolbar"><h2>Озвучка</h2><button onclick="closeModal()">Закрыть</button></div><p>Озвучка средствами браузера. Приоритет — британский английский. Наличие и тембр голосов зависят от устройства; некоторые голоса требуют интернета.</p><label for="voice">Английский голос</label><select id="voice" class="select" onchange="voiceId=this.value"><option value="">Автоматически · предпочтительно en-GB</option>${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===voiceId?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select><label for="speed">Скорость</label><select id="speed" class="select" onchange="rate=Number(this.value)">${[[.7,'Медленно'],[.85,'Учебная'],[1,'Обычная']].map(([v,t])=>`<option value="${v}" ${rate===v?'selected':''}>${t}</option>`).join('')}</select><label><input type="checkbox" ${auto?'checked':''} onchange="auto=this.checked"> Озвучивать автоматически при перевороте</label><button class="primary" onclick="speak('the twenty first of October, twenty twenty seven')">Проверить голос</button><p id="voiceStatus" class="status" role="status">${vs.length?'Доступно английских голосов: '+vs.length:'Английские голоса ещё не загружены или не установлены.'}</p><p class="meta">Ответы карточек озвучиваются только на обороте. В тесте на слух звук содержит задание.</p></section>`;document.getElementById('voice').focus()}
function closeModal(){cancel();document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',()=>{if(document.getElementById('voice'))settings()});
function fullscreen(){if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}else{document.documentElement.requestFullscreen?.().catch(()=>{})}}
function home(){cancel();current='home';app.innerHTML=`<section class="home"><div class="hero"><div><div class="eyebrow">Числительные / практика чтения вслух</div><h1>See the number.<br>Say it with confidence.</h1><p class="sub">Даты, годы, дроби и проценты без путаницы.<br>Сначала произнесите сами, затем откройте ответ и послушайте.</p></div><div class="stamp"><b>121</b><span>КАРТОЧКА / 10 ТЕМ</span></div></div><div class="flow"><button class="primary" onclick="startCards('Все темы')"><div class="eyebrow" style="color:#c5eeea">Шаг 01 / Learn</div><strong>Карточки с озвучкой</strong><span>Число → ваш ответ → оборот → аудиообразец</span></button><button onclick="testMenu()"><div class="eyebrow">Шаг 02 / Check</div><strong>Тесты и работа над ошибками</strong><span>Чтение • числа на слух • поиск неверного чтения</span></button></div><div class="topics">${cats.map((c,i)=>`<button class="topic" onclick="startCards(cats[${i}])">${esc(c)}<small>${DATA.filter(x=>x.cat===c).length} карточек</small></button>`).join('')}</div><div class="toolbar"><span class="meta">Выучено: ${saved.known.length} / 121 · На повторение: ${saved.review.length}</span><button class="small" onclick="startCards('Повторение')">Повторить трудные</button></div><p class="meta">Авторская практика навыка для подготовки к ЕГЭ, не официальный вариант экзамена. На обороте указано основное чтение и некоторые допустимые варианты. Прогресс хранится только в этом браузере; результат теста можно скачать и передать преподавателю.</p></section>`}
function shell(content,active){app.innerHTML=`<div class="workspace"><aside><button onclick="home()">← Главная</button><div class="sep"></div><div class="eyebrow">Карточки</div>${['Все темы',...cats,'Повторение'].map(c=>`<button class="${active===c?'active':''}" onclick="startCards('${c}')">${c}</button>`).join('')}<div class="sep"></div><button class="${active==='tests'?'active':''}" onclick="testMenu()">02 · Тесты</button></aside><section class="stage">${content}</section></div>`}
function startCards(cat){cancel();current='cards';category=cat;deck=cat==='Повторение'?DATA.filter(x=>saved.review.includes(x.id)):DATA.filter(x=>cat==='Все темы'||x.cat===cat);idx=0;back=false;renderCard()}
function renderCard(){if(!deck.length){shell('<div class="card"><h2>Пока нет трудных карточек</h2><p>На обороте нажимайте «Повторить», чтобы добавить карточку сюда.</p><button class="primary" onclick="startCards(\'Все темы\')">Начать карточки</button></div>',category);return}const d=deck[idx];shell(`<div class="toolbar"><div><div class="eyebrow">01 / ${esc(d.cat)}</div><p class="counter">Карточка ${idx+1} / ${deck.length}</p></div><button class="small" onclick="mixCards()">Перемешать</button></div><div class="progress"><i style="width:${(idx+1)/deck.length*100}%"></i></div><article class="card ${back?'back':''}" aria-live="polite">${back?`<div class="original">${esc(d.n)}</div><div class="answer" lang="en-GB">${esc(d.a)}</div>${d.alts.length?`<div class="alternative" lang="en-GB">Также: ${d.alts.map(esc).join(' / ')}</div>`:''}<div class="note">${esc(d.note)}</div><button class="primary" onclick="speak(DATA[${d.id}].a)">Слушать ответ</button><div id="voiceStatus" class="status" role="status">Британский голос — при наличии на устройстве</div>`:`<div class="eyebrow">Прочитайте вслух</div><div class="number" lang="en">${esc(d.n)}</div><p class="meta">${d.cat==='Годы'?'Прочитайте как год':d.cat==='Даты'?'Британский формат: день / месяц / год':'Сначала произнесите свой ответ'}</p><button class="primary" onclick="flip()">Перевернуть карточку</button>`}</article><div class="bottom"><button onclick="move(-1)" ${idx===0?'disabled':''}>← Назад</button><div class="row">${back?`<button onclick="flip()">Лицевая сторона</button><button onclick="mark(false)">Повторить</button><button class="primary" onclick="mark(true)">Знаю</button>`:''}</div><button onclick="move(1)" ${idx===deck.length-1?'disabled':''}>Далее →</button></div><div class="toolbar"><span class="meta"><kbd>Пробел</kbd> — переворот · <kbd>←</kbd> <kbd>→</kbd> — карточки</span><button class="small" onclick="testMenu()">К тестам →</button></div>`,category)}
function flip(){cancel();back=!back;renderCard();if(back&&auto)speak(deck[idx].a)}
function move(n){cancel();idx=Math.max(0,Math.min(deck.length-1,idx+n));back=false;renderCard()}
function mixCards(){cancel();deck=shuffle(deck);idx=0;back=false;renderCard()}
function mark(known){const id=deck[idx].id;saved.known=saved.known.filter(x=>x!==id);saved.review=saved.review.filter(x=>x!==id);saved[known?'known':'review'].push(id);save();if(idx<deck.length-1)move(1);else{cancel();shell(`<div class="card"><div class="eyebrow">Карточки пройдены</div><h2>Проверьте себя в тестах</h2><p>Выучено всего: ${saved.known.length}. На повторение: ${saved.review.length}.</p><div class="row"><button onclick="startCards('Повторение')">Повторить трудные</button><button class="primary" onclick="testMenu()">Начать тест</button></div></div>`,category)}}
function testMenu(){cancel();current='menu';shell(`<div class="testwrap"><div class="eyebrow">02 / Check</div><h2>От узнавания — к уверенному чтению</h2><p>Смешанный тест — 20 вопросов. Отдельная тема — до 12 вопросов. После каждого ответа — объяснение и озвучка.</p><div class="row"><label for="scope">Тема:</label><select id="scope" class="select">${['Все темы',...cats,'Повторение'].map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></div><div class="testcards" style="margin-top:22px"><button onclick="startQuiz('read')"><div class="eyebrow">Тест 01</div><strong>Выбери чтение</strong><span>Видите число. Найдите его правильное чтение среди четырёх вариантов.</span></button><button onclick="startQuiz('listen')"><div class="eyebrow">Тест 02</div><strong>Услышь число</strong><span>Слушайте без текста ответа. Выберите число, которое прозвучало.</span></button><button onclick="startQuiz('detect')"><div class="eyebrow">Тест 03</div><strong>Найди ошибку</strong><span>Сопоставьте запись и чтение. Решите, совпадают ли они.</span></button></div><p class="meta">В тесте проверяется соответствие числа и чтения. Произношение автоматически не оценивается. Выбранный голос можно проверить через «Звук».</p>${lastResult?'<button onclick="showResult()">Последний результат</button>':''}<p id="menuStatus" role="status"></p></div>`,'tests')}
const labels={read:'Выбери чтение',listen:'Услышь число',detect:'Найди ошибку'};
function startQuiz(mode,ids){cancel();let scope=document.getElementById('scope')?.value||'Все темы';let pool=ids?DATA.filter(d=>ids.includes(d.id)):DATA.filter(d=>scope==='Все темы'||(scope==='Повторение'?saved.review.includes(d.id):d.cat===scope));if(!pool.length){document.getElementById('menuStatus').textContent='В списке повторения пока нет карточек. Выберите тему или сначала отметьте трудные карточки.';return}quiz={mode,scope:ids?'Работа над ошибками':scope,items:shuffle(pool).slice(0,ids?pool.length:scope==='Все темы'?20:12),pos:0,records:[],answered:false};current='quiz';prepareQ()}
function prepareQ(){const q=quiz,d=q.items[q.pos],wrong=shuffle(DATA.filter(x=>x.cat===d.cat&&x.id!==d.id)).slice(0,3);q.options=shuffle([d,...wrong]);q.match=Math.random()<.5;q.shown=q.match?d:wrong[0];q.answered=false;renderQ()}
function renderQ(){const q=quiz,d=q.items[q.pos];shell(`<div class="quiz"><div class="toolbar"><div><div class="eyebrow">${labels[q.mode]} / ${esc(q.scope)}</div><p class="counter">Вопрос ${q.pos+1} / ${q.items.length} · ${esc(d.cat)}</p></div><button class="small" onclick="testMenu()">Выйти из теста</button></div><div class="progress"><i style="width:${q.pos/q.items.length*100}%"></i></div>${q.mode==='listen'?`<div class="card" style="min-height:160px;flex:none"><p>Какое число вы слышите?</p><button class="primary" onclick="speak(quiz.items[quiz.pos].a)">Слушать задание / ещё раз</button><span id="voiceStatus" class="status" role="status">Нажмите, чтобы воспроизвести</span></div>`:`<div class="qprompt" lang="en">${esc(d.n)}</div>`}${q.mode==='detect'?`<p style="text-align:center;font-size:clamp(21px,2.7vw,32px)" lang="en">${esc(q.shown.a)}</p><div class="options"><button class="option" id="opt0" onclick="answerQuiz(true)">Чтение верное</button><button class="option" id="opt1" onclick="answerQuiz(false)">В чтении ошибка</button></div>`:`<div class="options">${q.options.map((x,i)=>`<button class="option" id="opt${i}" onclick="answerQuiz(${x.id})" lang="en">${esc(q.mode==='listen'?x.n:x.a)}</button>`).join('')}</div>`}<div id="feedback" role="status" aria-live="polite"></div><div id="qnext"></div></div>`,'tests')}
function answerQuiz(value){if(quiz.answered)return;cancel();const q=quiz,d=q.items[q.pos],ok=q.mode==='detect'?value===q.match:value===d.id;q.answered=true;const oldStatus=document.getElementById('voiceStatus');if(oldStatus)oldStatus.id='taskVoiceStatus';const selected=q.mode==='detect'?(value?'Чтение верное':'В чтении ошибка'):(q.mode==='listen'?DATA[value].n:DATA[value].a);q.records.push({id:d.id,ok,selected,presented:q.mode==='detect'?q.shown.a:null});if(!ok){if(!saved.review.includes(d.id))saved.review.push(d.id);saved.known=saved.known.filter(x=>x!==d.id);save()}document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;const isRight=q.mode==='detect'?(i===0)===q.match:q.options[i].id===d.id;const isChosen=q.mode==='detect'?(i===0)===value:q.options[i].id===value;if(isRight)b.classList.add('correct');else if(isChosen)b.classList.add('wrong')});document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'':'bad'}"><strong>${ok?'Верно.':'Нужно повторить.'} ${esc(d.n)} → <span lang="en">${esc(d.a)}</span></strong>${esc(d.note)}${d.alts.length?`<p>Допустимо также: <span lang="en">${d.alts.map(esc).join(' / ')}</span></p>`:''}<div class="row" style="margin-top:8px"><button class="small" onclick="speak(quiz.items[quiz.pos].a)">Слушать правильный ответ</button><span id="voiceStatus" class="status" role="status"></span></div></div>`;document.getElementById('qnext').innerHTML=`<button class="primary" onclick="nextQ()">${q.pos===q.items.length-1?'Результат':'Следующий вопрос →'}</button>`}
function nextQ(){if(!quiz.answered)return;cancel();if(++quiz.pos>=quiz.items.length){lastResult={mode:quiz.mode,scope:quiz.scope,records:quiz.records,date:new Date().toLocaleString('ru-RU')};saved.history.push({date:lastResult.date,score:lastResult.records.filter(r=>r.ok).length,total:lastResult.records.length});saved.history=saved.history.slice(-10);save();showResult()}else prepareQ()}
function showResult(){cancel();current='result';const r=lastResult,correct=r.records.filter(x=>x.ok).length,wrong=r.records.filter(x=>!x.ok);shell(`<div class="testwrap"><div class="eyebrow">Результат / ${labels[r.mode]}</div><h2>${wrong.length?'Ошибки превращаем в тренировку':'Отлично: все ответы верные'}</h2><div class="result"><div class="score">${correct} / ${r.records.length}</div><p>${Math.round(correct/r.records.length*100)}% · ${esc(r.scope)} · ${esc(r.date)}</p><div class="row">${wrong.length?'<button class="primary" onclick="retryErrors()">Тест по ошибкам</button>':''}<button onclick="exportResult()">Скачать результат для преподавателя</button><button onclick="testMenu()">Другой тест</button></div><p class="meta">Файл результата нужно отправить преподавателю самостоятельно. Автоматической отправки нет.</p></div>${wrong.length?`<h2>Разбор ошибок</h2><div class="errors">${wrong.map(x=>{const d=DATA[x.id];return `<div class="error"><b>${esc(d.n)}</b> · ${esc(d.cat)}<br>Ваш ответ: ${esc(x.selected)}${x.presented?'<br>В задании было: '+esc(x.presented):''}<br><b lang="en">${esc(d.a)}</b><br>${esc(d.note)} <button class="small" onclick="speak(DATA[${d.id}].a)">Слушать</button></div>`}).join('')}</div><div id="voiceStatus" class="status" role="status"></div>`:'<p>Для закрепления прочитайте числа вслух без подсказок.</p>'}</div>`,'tests')}
function retryErrors(){startQuiz(lastResult.mode,lastResult.records.filter(x=>!x.ok).map(x=>x.id))}
function exportResult(){const r=lastResult;const lines=['NUMBER LAB · Результат тренировки','Ученик: ____________________','Дата: '+r.date,'Тест: '+labels[r.mode],'Тема: '+r.scope,'Баллы: '+r.records.filter(x=>x.ok).length+' / '+r.records.length,''];r.records.forEach((x,i)=>{const d=DATA[x.id];lines.push(`${i+1}. ${d.n} [${d.cat}]`,...(x.presented?['В задании: '+x.presented]:[]),'Ваш ответ: '+x.selected,'Правильное чтение: '+d.a,(x.ok?'ВЕРНО':'ОШИБКА'),'')});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}));a.download='Number_Lab_Result.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(current!=='cards'||!deck.length||!document.getElementById('modal').classList.contains('hidden')||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();flip()}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});
window.addEventListener('beforeunload',cancel);home();
</script></body></html>
